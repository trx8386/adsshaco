<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Trải nghiệm ngay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background: #000;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Container mô phỏng giao diện điện thoại */
    .page-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      position: relative;
      background: url('assets/background.png') center center / cover no-repeat;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    /* Nút bấm trải nghiệm ngay */
    .btn-experience {
      position: absolute;
      bottom: 6.0%; /* Khoảng 44px trên 731px chiều cao của thiết kế gốc */
      width: 64.28%; /* 270px trên 420px chiều rộng thiết kế gốc */
      height: 52px;
      background: rgba(250, 140, 22, 1); /* Màu cam gốc #FA8C16 */
      color: rgba(231, 229, 225, 1); /* Chữ màu kem gốc #E7E5E1 */
      border-radius: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(229, 231, 235, 1);
      transition: transform 0.1s ease, background-color 0.2s ease;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      text-align: center;
    }

    .btn-experience:active {
      transform: scale(0.96) translateY(2px);
      background-color: rgba(230, 120, 10, 1);
    }
  </style>
</head>
<body>

  <div class="page-container">
    <a href="https://m.sc88g.vip/?cid=2925260" class="btn-experience">
      TRẢI NGHIỆM NGAY
    </a>
  </div>

</body>
</html>
